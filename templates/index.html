<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Healthcare Diagnosis</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>
<body>

<div class="container">

    <div class="card">

        <h1><i class="fa-solid fa-heart-pulse"></i> AI Healthcare Diagnosis</h1>

        <p class="subtitle">
            Diabetes Prediction using Machine Learning
        </p>

        <form action="/predict" method="POST">

            <div class="grid">

                <div class="input-box">
                    <label>Pregnancies</label>
                    <input type="number" name="Pregnancies" required>
                </div>

                <div class="input-box">
                    <label>Glucose</label>
                    <input type="number" name="Glucose" required>
                </div>

                <div class="input-box">
                    <label>Blood Pressure</label>
                    <input type="number" name="BloodPressure" required>
                </div>

                <div class="input-box">
                    <label>Skin Thickness</label>
                    <input type="number" name="SkinThickness" required>
                </div>

                <div class="input-box">
                    <label>Insulin</label>
                    <input type="number" name="Insulin" required>
                </div>

                <div class="input-box">
                    <label>BMI</label>
                    <input type="number" step="0.1" name="BMI" required>
                </div>

                <div class="input-box">
                    <label>Diabetes Pedigree Function</label>
                    <input type="number" step="0.001" name="DiabetesPedigreeFunction" required>
                </div>

                <div class="input-box">
                    <label>Age</label>
                    <input type="number" name="Age" required>
                </div>

            </div>

            <button type="submit">
                <i class="fa-solid fa-stethoscope"></i>
                Predict
            </button>

        </form>

        {% if prediction %}
        <div class="result">
            <h2>{{ prediction }}</h2>

            <p> Confidence:
                <strong>
                    {{ confidence }}%</strong>
            </p>
        </div>
        {% endif %}

        {% if shap_plot %}
        <div class="shap-container">
            <h2>AI Explanation (SHAP)</h2>
            <!-- Display SHAP explanation image -->
            <img src="{{ url_for('static', filename=shap_plot) }}"
            alt="SHAP Explanation"
            class="shap-image">
        </div>
        {% endif %}



    </div>

</div>

</body>
</html>
